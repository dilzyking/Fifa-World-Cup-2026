<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HLS Player · The Cricsters</title>

    <!-- Plyr core + HLS.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js" crossorigin="anonymous"></script>

    <style>
        /* reset & base – minimal, just player */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a1733;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }

        .player-card {
            width: 100%;
            max-width: 980px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(30, 120, 255, 0.25);
            position: relative;
        }

        .player-wrapper {
            width: 100%;
            position: relative;
            background: #000;
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            background: #000;
        }

        /* error overlay – same style */
        .error-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 16px;
            padding: 24px;
            text-align: center;
        }

        .error-overlay.visible {
            display: flex;
        }

        .error-message {
            color: #f0f4ff;
            font-size: 1rem;
            opacity: 0.9;
            max-width: 320px;
        }

        .retry-btn {
            padding: 10px 28px;
            border-radius: 40px;
            background: #1e78ff;
            color: #fff;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(30, 120, 255, 0.3);
        }

        .retry-btn:hover {
            background: #3b8aff;
        }

        /* small caption */
        .player-footer {
            background: #0b1a33;
            padding: 10px 16px;
            text-align: center;
            color: #9bb7f0;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.3px;
        }

        .player-footer span {
            opacity: 0.7;
        }

        /* responsive */
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }
            .player-card {
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="player-wrapper" id="playerContainer">
            <!-- video element: plyr will attach here -->
            <video id="video" class="video-player" autoplay playsinline muted
                poster="https://raw.githubusercontent.com/thecricstersxbigcric/test/refs/heads/main/open%20link%20in%20google%20chorme%20only.png">
            </video>

            <!-- error overlay (hidden by default) -->
            <div id="errorOverlay" class="error-overlay">
                <p id="errorMsg" class="error-message">Unable to load stream. Please try again.</p>
                <button class="retry-btn" id="retryBtn">Retry</button>
            </div>
        </div>
        <div class="player-footer">
            <span>⚡ HLS · The Cricsters ✘ BigCric</span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---- DIRECT STREAM URL (hardcoded as requested) ----
            const STREAM_URL = 'https://livecf.fancode.com/143353_english_hls_63ced2230f71145_1ta-di_h264/index.m3u8';

            // ---- DOM refs ----
            const video = document.getElementById('video');
            const errorOverlay = document.getElementById('errorOverlay');
            const errorMsg = document.getElementById('errorMsg');
            const retryBtn = document.getElementById('retryBtn');

            let hlsInstance = null;
            let plyrInstance = null;
            let isDestroyed = false;

            // ---- helpers ----
            function showError(msg) {
                errorMsg.textContent = msg || 'Failed to load stream. Please retry.';
                errorOverlay.classList.add('visible');
            }

            function hideError() {
                errorOverlay.classList.remove('visible');
            }

            function destroyPlayer() {
                if (hlsInstance) {
                    try { hlsInstance.destroy(); } catch (_) {}
                    hlsInstance = null;
                }
                if (plyrInstance) {
                    try { plyrInstance.destroy(); } catch (_) {}
                    plyrInstance = null;
                }
                // keep video element clean
                video.removeAttribute('src');
                video.load();
            }

            // ---- main loader (exactly the logic from the original) ----
            function loadStream() {
                // if we destroyed, don't attempt (but we can reinit)
                if (isDestroyed) {
                    isDestroyed = false;
                }

                hideError();
                destroyPlayer(); // clean previous instances

                // ---- 1) try HLS.js (primary) ----
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        maxMaxBufferLength: 100,
                        liveSyncDurationCount: 3,
                        liveMaxLatencyDurationCount: 6,
                        enableWorker: true,
                        xhrSetup: function(xhr) {
                            xhr.withCredentials = false;
                        }
                    });

                    hlsInstance = hls;
                    hls.loadSource(STREAM_URL);
                    hls.attachMedia(video);

                    // when manifest is parsed, build plyr with quality selector
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        // collect height levels
                        const levels = hls.levels
                            .map(l => l.height)
                            .filter(Boolean)
                            .sort((a, b) => a - b);

                        // plyr settings
                        const qualityOptions = levels.length ? levels : [360, 480, 720, 1080];
                        const defaultQuality = levels[levels.length - 1] || 720;

                        plyrInstance = new Plyr(video, {
                            controls: [
                                'play-large', 'play', 'progress', 'current-time',
                                'mute', 'volume', 'settings', 'fullscreen'
                            ],
                            settings: ['quality'],
                            quality: {
                                default: defaultQuality,
                                options: qualityOptions,
                                forced: true,
                                onChange: function(newQuality) {
                                    // apply quality level to hls
                                    hls.levels.forEach((level, index) => {
                                        if (level.height === newQuality) {
                                            hls.currentLevel = index;
                                        }
                                    });
                                }
                            }
                        });

                        // unmute (user can still mute)
                        video.muted = false;
                    });

                    // error handling (fatal / non-fatal)
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                // try to recover by restarting load
                                hls.startLoad();
                            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                                hls.recoverMediaError();
                            } else {
                                // fatal: show error
                                showError('Stream error. Please retry.');
                            }
                        } else {
                            // non-fatal: ignore, but we can log
                            console.warn('HLS non-fatal error:', data);
                        }
                    });

                    // if hls fails completely (no manifest) we might show error after timeout
                    // but we rely on error event.

                } 
                // ---- 2) fallback: native HLS (Safari / iOS) ----
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = STREAM_URL;
                    plyrInstance = new Plyr(video, {
                        controls: [
                            'play-large', 'play', 'progress', 'current-time',
                            'mute', 'volume', 'settings', 'fullscreen'
                        ]
                    });
                    video.muted = false;
                } 
                // ---- 3) not supported ----
                else {
                    showError('Your browser does not support HLS streaming. Please use Chrome or Safari.');
                }
            }

            // ---- retry button ----
            retryBtn.addEventListener('click', function() {
                // fully reset and reload
                hideError();
                // if there's a hanging instance, destroy
                destroyPlayer();
                // reload
                loadStream();
            });

            // ---- initial load ----
            loadStream();

            // ---- (optional) clean up on page unload ----
            window.addEventListener('beforeunload', function() {
                if (hlsInstance) {
                    try { hlsInstance.destroy(); } catch (_) {}
                }
                if (plyrInstance) {
                    try { plyrInstance.destroy(); } catch (_) {}
                }
            });

            // expose for debugging (optional)
            console.log('✅ Player initialized with stream:', STREAM_URL);

        })();
    </script>

</body>
</html>
